<mat-toolbar color="primary" class="home-toolbar">
  <span>Home</span>
</mat-toolbar>

<div class="home-wrapper">
  @if (user(); as currentUser) {
    <mat-card class="home-card" appearance="outlined">
      <mat-card-header>
        <mat-card-title>
          Hola, {{ currentUser.name }}
        </mat-card-title>
        <mat-card-subtitle>
          {{ currentUser.email }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-divider></mat-divider>

      <mat-card-content>
        <section class="info-section" aria-labelledby="roles-heading">
          <h3 id="roles-heading">Roles</h3>
          <div class="roles">
            @if (currentUser.roles?.length) {
              @for (role of currentUser.roles; track role) {
                <mat-chip color="primary" selected>{{ role }}</mat-chip>
              }
            } @else {
              <span class="no-roles">Sin roles asignados</span>
            }
          </div>
        </section>
      </mat-card-content>

      <mat-card-actions align="end" class="actions">
        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="openProfile()"
          aria-label="Abrir sección de perfil"
        >
          <mat-icon aria-hidden="true">person</mat-icon>
          <span>Perfil</span>
        </button>

        @if (isAdmin()) {
          <button
            mat-stroked-button
            color="accent"
            type="button"
            [routerLink]="['/users']"
            aria-label="Ir a gestión de usuarios"
          >
            <mat-icon aria-hidden="true">group</mat-icon>
            <span>Gestión de Usuarios</span>
          </button>
        }
      </mat-card-actions>
    </mat-card>
  }
</div>
