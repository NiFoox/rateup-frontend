<mat-card class="top-game-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="rank-badge" *ngIf="index as idx">
      #{{ idx }}
    </div>
    <mat-card-title>{{ game.name }}</mat-card-title>
    <mat-card-subtitle>{{ game.genre }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="metrics">
      <span *ngIf="game.avgScore as score">
        <mat-icon aria-hidden="true">star</mat-icon>
        {{ score | number : '1.1-1' }}/5
      </span>

      <span *ngIf="game.reviewCount as count">
        • {{ count }} reseña{{ count === 1 ? '' : 's' }}
      </span>
    </p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button
      mat-stroked-button
      color="primary"
      [routerLink]="['/reviews']"
      [queryParams]="{ gameId: game.id }"
      aria-label="Ver reseñas de {{ game.name }}"
    >
      Ver reseñas
    </button>

    <button
      mat-button
      [routerLink]="['/games']"
      aria-label="Ver juego en listado"
    >
      Ver en juegos
    </button>
  </mat-card-actions>
</mat-card>
