<mat-card class="game-card">
  <mat-card-header>
    <div mat-card-avatar class="game-card__avatar">
      <mat-icon>sports_esports</mat-icon>
    </div>
    <mat-card-title>{{ game.name }}</mat-card-title>
    <mat-card-subtitle>{{ game.genre }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ game.description }}</p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-button color="primary" [routerLink]="['/games', game.id]" *ngIf="hasId">Ver</button>
    <button mat-stroked-button color="primary" [routerLink]="['/games', game.id, 'edit']" *ngIf="hasId">Editar</button>
  </mat-card-actions>
</mat-card>
