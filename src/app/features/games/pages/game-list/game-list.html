<div class="games-page-list">
  <h1>Juegos</h1>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Género</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let game of games">
          <td class="game-name">{{ game.name }}</td>
          <td>{{ game.description }}</td>
          <td>{{ game.genre }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
