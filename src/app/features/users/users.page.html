<section class="users-page">
  <header class="users-header">
    <div class="header-left">
      <div class="title-with-icon">
        <mat-icon aria-hidden="true">person</mat-icon>
        <div class="title-text">
          <h1>Usuarios</h1>
          <p>Gestiona los accesos y estados del equipo.</p>
        </div>
      </div>

      <form class="users-search" [formGroup]="filterForm">
        <mat-form-field appearance="outline">
          <mat-label>Buscar</mat-label>
          <input matInput formControlName="search" placeholder="Nombre o email" />
          <button
            mat-icon-button
            matSuffix
            *ngIf="filterForm.controls.search.value"
            (click)="filterForm.controls.search.setValue('')"
            type="button"
            aria-label="Limpiar búsqueda"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </form>
    </div>

    <div class="header-right">
      <button mat-flat-button color="primary" (click)="openCreateDialog()" class="new-user-btn">
        <mat-icon>person_add</mat-icon>
        Nuevo usuario
      </button>
    </div>
  </header>

  <div class="table-wrapper" [class.loading]="isLoading() || isMutating()">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      matSortDisableClear
      matSortActive="createdAt"
      matSortDirection="desc"
      (matSortChange)="onSortChange($event)"
    >
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="username">Nombre</th>
        <td mat-cell *matCellDef="let user">
          <span class="user-username">
            {{ user.username }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="email">Email</th>
        <td mat-cell *matCellDef="let user">
          <span class="user-email">
            {{ user.email }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="roles">Roles</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip-set class="roles-chipset">
            <mat-chip *ngFor="let role of user.roles" color="primary" selected>
              {{ role | titlecase }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="isActive">Activo</th>
        <td mat-cell *matCellDef="let user">
          <mat-slide-toggle
            [checked]="user.isActive"
            (change)="toggleStatus(user, $event.checked)"
            [disabled]="isMutating()"
            color="primary"
            aria-label="Cambiar estado"
          ></mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="createdAt">Creado</th>
        <td mat-cell *matCellDef="let user">
          {{ user.createdAt | date: 'mediumDate' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header-cell">
          Acciones
        </th>
        <td mat-cell *matCellDef="let user">
          <div class="actions-cell">
            <button
              mat-icon-button
              [routerLink]="['/profile', user.id]"
              matTooltip="Ver perfil público"
              aria-label="Ver perfil público"
            >
              <mat-icon>open_in_new</mat-icon>
            </button>

            <button
              mat-icon-button
              (click)="openEditDialog(user)"
              [disabled]="isMutating()"
              matTooltip="Editar usuario"
              aria-label="Editar usuario"
            >
              <mat-icon>edit</mat-icon>
            </button>

            <button
              mat-icon-button
              color="warn"
              (click)="confirmDelete(user)"
              [disabled]="isMutating()"
              matTooltip="Eliminar usuario"
              aria-label="Eliminar usuario"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <div class="empty-state" *ngIf="!isLoading() && dataSource.data.length === 0">
      <mat-icon>group_off</mat-icon>
      <p>No se encontraron usuarios con los filtros seleccionados.</p>
    </div>

    <div class="overlay" *ngIf="isLoading() || isMutating()">
      <mat-progress-spinner mode="indeterminate" diameter="48"></mat-progress-spinner>
    </div>
  </div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5, 10, 25]"
    (page)="onPageChange($event)"
    aria-label="Paginación de usuarios"
  ></mat-paginator>
</section>
