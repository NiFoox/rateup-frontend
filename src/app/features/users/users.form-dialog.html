<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo usuario' : 'Editar usuario' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <div class="field-group">
      <mat-form-field appearance="fill">
        <mat-label id="nameLabel">Nombre</mat-label>
        <input
          matInput
          formControlName="name"
          required
          aria-required="true"
          aria-labelledby="nameLabel"
          placeholder="Nombre"
        />
        <mat-error *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">
          El nombre es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" required aria-label="Email" />
        <mat-error *ngIf="form.get('email')?.hasError('required')">El email es obligatorio.</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Ingresa un email válido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Roles</mat-label>
        <mat-select formControlName="roles" multiple required>
          <mat-option *ngFor="let role of rolesOptions" [value]="role">
            {{ role | titlecase }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.controls.roles.hasError('required')">
          Selecciona al menos un rol.
        </mat-error>
      </mat-form-field>

      <mat-slide-toggle formControlName="active">Activo</mat-slide-toggle>
      <mat-form-field appearance="fill">
        <mat-label id="passwordLabel">Contraseña</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          required
          aria-required="true"
          aria-labelledby="passwordLabel"
          placeholder="Contraseña"
        />
        <mat-hint>Opcional. Por defecto será "Demo1234".</mat-hint>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      {{ data.mode === 'create' ? 'Crear' : 'Guardar' }}
    </button>
  </mat-dialog-actions>
</form>
